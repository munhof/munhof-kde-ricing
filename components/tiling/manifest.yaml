id: tiling
description: "Enable an already-installed Polonium KWin script; configure native tiling gaps."
requires:
  commands:
    - kreadconfig6
    - kwriteconfig6
    - kpackagetool6
  kwin_script: polonium
operations:
  - file: kwinrc
    group: Plugins
    key: poloniumEnabled
    value: "true"
  - file: kwinrc
    group: Tiling
    key: padding
    value: "10"
